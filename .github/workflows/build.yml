name: build

# Checks that every push and pull request builds, and keeps the installer as a
# build artifact. Releases are NOT made here: they are built and signed on the
# author's PC (tools/release.ps1), so the signing key never touches GitHub.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      # Actions are pinned to full commit hashes: a tag can be moved to other
      # code by whoever controls the action's repository, a hash cannot.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --version 6.7.1 -y --no-progress }

      - name: Build
        shell: pwsh
        run: .\build.ps1 -Version 0.0.0 -RepoUrl "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer
          path: dist/*.exe
